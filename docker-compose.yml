version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: always

  ml_service:
    build:
      context: ./backend
      dockerfile: Dockerfile.ml
    ports:
      - "5001:5001"
    restart: always
